# =============================================================================
# nginx access.log -> data stream logs-siem.nginx-default
# log_format "siem" (victima/nginx-siem.conf) = combined + X-Forwarded-For + tiempo:
#   10.0.0.7 - - [04/Nov/2026:10:01:02 +0000] "GET /buscar?q=1 HTTP/1.1" 200 12 "-" "curl/7.88" "185.220.101.34" 0.001
# =============================================================================
filter {
  if [fields][origen] == "nginx" {
    mutate {
      add_field => {
        "[data_stream][dataset]" => "siem.nginx"
        "[event][module]"        => "nginx"
        "[event][category]"      => "web"
        "[event][type]"          => "access"
        "[event][action]"        => "http_request"
      }
    }

    grok {
      match => { "message" => [
        # Petición HTTP normal
        '^%{IPORHOST:[@metadata][remoto]} - %{DATA:[@metadata][usuario]} \[%{HTTPDATE:[@metadata][ts]}\] "%{WORD:[http][request][method]} %{NOTSPACE:[url][original]} HTTP/%{NUMBER:[http][version]}" %{INT:[http][response][status_code]:int} %{INT:[http][response][body][bytes]:int} "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}" "%{DATA:[@metadata][xff]}" %{NUMBER:[@metadata][duracion]:float}$',
        # Petición inválida (p. ej. sondas de nmap): nginx la registra igual, con código 400
        '^%{IPORHOST:[@metadata][remoto]} - %{DATA:[@metadata][usuario]} \[%{HTTPDATE:[@metadata][ts]}\] "%{DATA:[@metadata][peticion_cruda]}" %{INT:[http][response][status_code]:int} %{INT:[http][response][body][bytes]:int} "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}" "%{DATA:[@metadata][xff]}" %{NUMBER:[@metadata][duracion]:float}$'
      ] }
      tag_on_failure => ["_fallo_nginx"]
    }

    if "_fallo_nginx" not in [tags] {
      date {
        match => ["[@metadata][ts]", "dd/MMM/yyyy:HH:mm:ss Z"]
        locale => "en"
        tag_on_failure => ["_fallo_fecha"]
      }

      # IP de origen: si viene detrás de un balanceador (X-Forwarded-For), se usa la primera IP de esa cabecera.
      grok {
        match => { "[@metadata][xff]" => "^%{IP:[source][ip]}" }
        tag_on_failure => []
      }
      if ![source][ip] {
        mutate { add_field => { "[source][ip]" => "%{[@metadata][remoto]}" } }
      }
      mutate { add_field => { "[source][address]" => "%{[@metadata][remoto]}" } }

      if [@metadata][peticion_cruda] {
        mutate {
          add_tag   => ["peticion_invalida"]
          add_field => { "[url][original]" => "%{[@metadata][peticion_cruda]}" }
        }
      }

      if [url][original] {
        grok {
          match => { "[url][original]" => "^%{URIPATH:[url][path]}(?:\?%{GREEDYDATA:[url][query]})?" }
          tag_on_failure => []
        }
        mutate { copy => { "[url][original]" => "[@metadata][url_decodificada]" } }
        urldecode { field => "[@metadata][url_decodificada]" }
      }

      if [http][response][status_code] >= 400 {
        mutate { add_field => { "[event][outcome]" => "failure" } }
      } else {
        mutate { add_field => { "[event][outcome]" => "success" } }
      }

      # ---- Banderas que usan las reglas de detección ------------------------
      if [url][path] =~ /^\/(admin|wp-admin|wp-login\.php|phpmyadmin|\.env|\.git|config\.php|server-status|backup|etc\/passwd)/ {
        mutate { add_field => { "[siem][ruta_sensible]" => "true" } }
      }
      if [@metadata][url_decodificada] =~ /(?i)(union(\s|\+)+(all(\s|\+)+)?select|'(\s|\+)*or(\s|\+)*'?\d|(\s|\+)or(\s|\+)+1=1|sleep\(|benchmark\(|information_schema|;(\s|\+)*drop(\s|\+)|xp_cmdshell)/ {
        mutate { add_field => { "[siem][sqli]" => "true" } }
      }
      if [user_agent][original] =~ /(?i)(nmap|sqlmap|nikto|hydra|masscan|zgrab|gobuster|dirbuster|wpscan)/ {
        mutate { add_field => { "[siem][herramienta_ataque]" => "true" } }
      }
      mutate {
        convert => {
          "[siem][ruta_sensible]"      => "boolean"
          "[siem][sqli]"               => "boolean"
          "[siem][herramienta_ataque]" => "boolean"
        }
      }
    }
  }
}
