# =============================================================================
# auth.log (sshd, sudo, PAM) -> data stream logs-siem.auth-default
# Formato de rsyslog (RSYSLOG_FileFormat):
#   2026-11-04T15:02:11.123456+00:00 victima sshd[812]: Failed password for root from 10.0.0.5 port 50122 ssh2
# =============================================================================
filter {
  if [fields][origen] == "auth" {
    mutate {
      add_field => {
        "[data_stream][dataset]" => "siem.auth"
        "[event][module]"        => "system"
        "[event][category]"      => "authentication"
      }
    }

    # 1) Encabezado syslog. Si no cuadra, la línea está malformada -> índice de errores.
    grok {
      match => { "message" => "^%{TIMESTAMP_ISO8601:[@metadata][ts]} %{SYSLOGHOST:[host][hostname]} %{PROG:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[@metadata][msg]}$" }
      tag_on_failure => ["_fallo_encabezado"]
    }

    if "_fallo_encabezado" not in [tags] {
      date {
        match => ["[@metadata][ts]", "ISO8601"]
        tag_on_failure => ["_fallo_fecha"]
      }

      if [process][name] == "sshd" {
        # 2) Usuario, IP y puerto. Las líneas de sshd que no traen IP se quedan como "otro".
        grok {
          match => { "[@metadata][msg]" => [
            "^Failed %{WORD:[@metadata][metodo]} for (?:invalid user )?%{USERNAME:[user][name]} from %{IP:[source][ip]} port %{POSINT:[source][port]:int}",
            "^Accepted %{WORD:[@metadata][metodo]} for %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{POSINT:[source][port]:int}",
            "^Invalid user %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{POSINT:[source][port]:int}",
            "^(?:Connection closed|Disconnected|Received disconnect) (?:by|from) (?:\S+ )*?%{IP:[source][ip]} port %{POSINT:[source][port]:int}"
          ] }
          tag_on_failure => []
        }

        if [@metadata][msg] =~ /^Failed / {
          mutate { add_field => { "[event][action]" => "ssh_login" "[event][outcome]" => "failure" "[event][type]" => "start" } }
        } else if [@metadata][msg] =~ /^Accepted / {
          mutate { add_field => { "[event][action]" => "ssh_login" "[event][outcome]" => "success" "[event][type]" => "start" } }
        } else if [@metadata][msg] =~ /^Invalid user / {
          mutate { add_field => { "[event][action]" => "ssh_usuario_invalido" "[event][outcome]" => "failure" } }
        } else if [@metadata][msg] =~ /^(Connection closed|Disconnected|Received disconnect)/ {
          mutate { add_field => { "[event][action]" => "ssh_desconexion" } }
        } else {
          mutate { add_field => { "[event][action]" => "ssh_otro" } }
        }
      } else if [process][name] == "sudo" {
        mutate { add_field => { "[event][action]" => "sudo" } }
      } else {
        mutate { add_field => { "[event][action]" => "auth_otro" } }
      }

      # 3) Hora de Colombia (UTC-5, sin horario de verano) y si fue fuera de horario laboral.
      #    Horario laboral: lunes a sábado de 7:00 a 19:00. Sirve para la regla de login fuera de horario.
      ruby {
        code => '
          t = event.get("@timestamp").time.getutc - 5 * 3600
          event.set("[siem][hora_local]", t.hour)
          event.set("[siem][fuera_de_horario]", t.hour < 7 || t.hour >= 19 || t.sunday?)
        '
      }

      mutate { replace => { "message" => "%{[@metadata][msg]}" } }
    }
  }
}
