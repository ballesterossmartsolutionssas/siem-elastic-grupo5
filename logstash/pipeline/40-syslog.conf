# =============================================================================
# syslog -> logs-siem.syslog-default
# Las conexiones a puertos señuelo (portguard) van aparte -> logs-siem.red-default
#   2026-11-04T15:03:00.1+00:00 victima portguard: conexion src=172.18.0.9 spt=40122 dpt=3306 proto=tcp
# =============================================================================
filter {
  if [fields][origen] == "syslog" {
    grok {
      match => { "message" => "^%{TIMESTAMP_ISO8601:[@metadata][ts]} %{SYSLOGHOST:[host][hostname]} %{PROG:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[@metadata][msg]}$" }
      tag_on_failure => ["_fallo_encabezado"]
    }

    if "_fallo_encabezado" not in [tags] {
      date {
        match => ["[@metadata][ts]", "ISO8601"]
        tag_on_failure => ["_fallo_fecha"]
      }

      if [process][name] == "portguard" and [@metadata][msg] =~ /^conexion / {
        kv {
          source      => "[@metadata][msg]"
          target      => "[@metadata][kv]"
          include_keys => ["src", "spt", "dpt", "proto"]
        }
        mutate {
          add_field => {
            "[data_stream][dataset]" => "siem.red"
            "[event][module]"        => "portguard"
            "[event][category]"      => "network"
            "[event][type]"          => "connection"
            "[event][action]"        => "conexion_puerto"
            "[source][ip]"           => "%{[@metadata][kv][src]}"
            "[source][port]"         => "%{[@metadata][kv][spt]}"
            "[destination][port]"    => "%{[@metadata][kv][dpt]}"
            "[network][transport]"   => "%{[@metadata][kv][proto]}"
          }
        }
        mutate { convert => { "[source][port]" => "integer" "[destination][port]" => "integer" } }
      } else {
        mutate {
          add_field => {
            "[data_stream][dataset]" => "siem.syslog"
            "[event][module]"        => "system"
            "[event][category]"      => "host"
            "[event][action]"        => "syslog"
          }
        }
      }
      mutate { replace => { "message" => "%{[@metadata][msg]}" } }
    } else {
      mutate { add_field => { "[data_stream][dataset]" => "siem.syslog" } }
    }
  }
}
