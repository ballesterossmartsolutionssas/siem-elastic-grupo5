# =============================================================================
# Kubernetes (cuarta fuente, R8.2) -> data stream logs-siem.k8s-default
# Llega de Filebeat como DaemonSet (kubernetes/filebeat-k8s.yaml), con kubernetes.*
# (namespace, pod, contenedor, nodo y etiquetas) ya agregados.
# El nginx de la app de ejemplo usa el formato combined estándar.
# =============================================================================
filter {
  if [fields][origen] == "k8s" {
    mutate {
      add_field => {
        "[data_stream][dataset]" => "siem.k8s"
        "[event][module]"        => "kubernetes"
        "[event][kind]"          => "event"
      }
    }

    if [kubernetes][container][name] == "web" and [message] =~ /^\S+ - / {
      grok {
        match => { "message" => '^%{IPORHOST:[source][ip]} - %{DATA:[@metadata][usuario]} \[%{HTTPDATE:[@metadata][ts]}\] "%{WORD:[http][request][method]} %{NOTSPACE:[url][original]} HTTP/%{NUMBER:[http][version]}" %{INT:[http][response][status_code]:int} %{INT:[http][response][body][bytes]:int} "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}"' }
        tag_on_failure => ["_k8s_sin_formato_http"]
      }
      if [http][response][status_code] {
        mutate { add_field => { "[event][category]" => "web" "[event][action]" => "http_request" } }
        if [http][response][status_code] >= 400 {
          mutate { add_field => { "[event][outcome]" => "failure" } }
        } else {
          mutate { add_field => { "[event][outcome]" => "success" } }
        }
        if [url][original] =~ /(?i)(\/\.env|\/\.git|\/admin|wp-login|phpmyadmin|backup)/ {
          mutate { add_field => { "[siem][ruta_sensible]" => "true" } }
        }
        if [user_agent][original] =~ /(?i)(nmap|sqlmap|nikto|hydra|gobuster|dirbuster|wpscan)/ {
          mutate { add_field => { "[siem][herramienta_ataque]" => "true" } }
        }
        mutate { convert => { "[siem][ruta_sensible]" => "boolean" "[siem][herramienta_ataque]" => "boolean" } }
      }
    } else {
      mutate { add_field => { "[event][action]" => "log_contenedor" } }
    }
  }
}
