# Una sola salida: cada evento va al data stream logs-<[data_stream][dataset]>-default
# (logs-siem.auth-default, logs-siem.nginx-default, logs-siem.syslog-default,
#  logs-siem.red-default y logs-siem.errores-default).
output {
  elasticsearch {
    hosts                       => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
    user                        => "logstash_internal"
    password                    => "${LOGSTASH_PASSWORD}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    data_stream                 => "true"
    data_stream_type            => "logs"
    data_stream_namespace       => "default"
  }
}
