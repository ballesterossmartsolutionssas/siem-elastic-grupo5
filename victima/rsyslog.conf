# rsyslog mínimo para contenedor: sin imklog (no hay kernel log en Docker).
module(load="imuxsock")

$FileCreateMode 0644
$RepeatedMsgReduction off

# Formato con fecha RFC 3339 y zona horaria: más fácil de parsear que el tradicional.
auth,authpriv.*            /var/log/auth.log;RSYSLOG_FileFormat
*.*;auth,authpriv.none     /var/log/syslog;RSYSLOG_FileFormat
