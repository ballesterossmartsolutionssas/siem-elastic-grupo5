# combined + X-Forwarded-For + tiempo de respuesta. Logstash lo parsea en 30-nginx.conf.
log_format siem '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" $request_time';

server {
    listen 80 default_server;
    server_name _;
    root /var/www/siem;

    access_log /var/log/nginx/access.log siem;
    error_log  /var/log/nginx/error.log warn;

    # Tienda de mentiras: lo justo para que haya tráfico creíble.
    location = /         { try_files /index.html =404; }
    location = /buscar   { default_type text/plain; return 200 "resultados de la busqueda\n"; }
    location = /producto { default_type text/plain; return 200 "detalle del producto\n"; }
    location = /login    { default_type text/plain; return 200 "formulario de ingreso\n"; }
    location /static/    { try_files $uri =404; }
    location /           { try_files $uri =404; }
}
